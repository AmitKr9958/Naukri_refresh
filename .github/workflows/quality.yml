name: Naukri Refresh Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax checks
        run: npm test

      - name: PowerShell syntax checks
        shell: pwsh
        run: |
          $files = @(
            "run-background.ps1",
            "install-background.ps1",
            "uninstall-background.ps1"
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput(
              (Get-Content $file -Raw),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Error "PowerShell syntax errors found in $file"
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

          Write-Host "All PowerShell scripts passed syntax validation."
